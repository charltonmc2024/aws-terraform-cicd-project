---
version: 0.2

phases:

  install:
    commands:
      - echo Installing dependencies
      - apt-get update
      - apt-get install -y unzip wget curl

      - echo Downloading Terraform
      - wget -q -O terraform.zip https://releases.hashicorp.com/terraform/1.14.4/terraform_1.14.4_linux_amd64.zip

      - echo Checking Terraform package
      - ls -lh terraform.zip
      - unzip -t terraform.zip

      - echo Extracting Terraform
      - unzip -o terraform.zip

      - mv terraform /usr/local/bin/

      - terraform version
      - docker version


  build:
    commands:

      - echo Testing Terraform
      - cd terraform
      - terraform init -backend=false
      - terraform validate
      - cd ..

      - echo Building Docker image
      - docker build -t nginx-test ./application

      - echo Running NGINX container
      - docker run -d -p 8080:80 --name nginx-test nginx-test

      - sleep 5

      - echo Testing website
      - curl http://localhost:8080


  post_build:
    commands:
      - docker ps
      - docker stop $(docker ps -q) || true