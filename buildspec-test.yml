---
version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.15.8"

phases:
  install:
    commands:
      - echo Installing dependencies
      - apt-get update
      - apt-get install -y unzip curl

      - echo Checking Terraform
      - terraform --version || true

      - echo Downloading Terraform
      - rm -f terraform.zip
      - curl -fsSLo terraform.zip -L "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

      - echo Verifying Terraform archive
      - unzip -t terraform.zip > /dev/null

      - echo Extracting Terraform
      - rm -rf /tmp/terraform-bin
      - mkdir -p /tmp/terraform-bin
      - unzip -o terraform.zip -d /tmp/terraform-bin
      - install -m 0755 /tmp/terraform-bin/terraform /usr/local/bin/terraform

      - terraform version
      - docker version

  build:
    commands:
      - echo Testing Terraform
      - cd terraform
      - terraform init -backend=false
      - terraform validate
      - cd ..

      - echo Creating pipeline artifact
      - printf 'Terraform validation completed successfully\n' > test-output.txt

      - echo Building Docker image
      - SRC_DIR="${CODEBUILD_SRC_DIR:-$PWD}"
      - APP_DIR=""
      - for candidate in "$SRC_DIR" "$SRC_DIR/application" "$SRC_DIR/src/application" "$SRC_DIR/src"; do
        if [ -f "$candidate/Dockerfile" ]; then APP_DIR="$candidate"; break; fi
        done
      - if [ -z "$APP_DIR" ]; then echo "application directory missing"; exit 1; fi
      - echo "Using application directory: $APP_DIR"
      - docker build -t nginx-test -f "$APP_DIR/Dockerfile" "$APP_DIR"

      - echo Running NGINX container
      - docker run -d -p 8080:80 --name nginx-test nginx-test

      - sleep 5

      - echo Testing website
      - curl http://localhost:8080

  post_build:
    commands:
      - echo Cleaning up container
      - docker stop nginx-test || true
      - docker rm nginx-test || true

artifacts:
  files:
    - test-output.txt
