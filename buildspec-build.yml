---
version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPOSITORY_URI: 691778449106.dkr.ecr.us-east-1.amazonaws.com/nginx-app-repo

phases:
  install:
    commands:
      - echo Checking Docker
      - docker --version
      - echo Checking zip
      - zip --version

  pre_build:
    commands:
      - echo Logging into Amazon ECR
      - |
        aws ecr get-login-password --region $AWS_REGION |
        docker login --username AWS --password-stdin $ECR_REPOSITORY_URI

  build:
    commands:
      - echo Current directory
      - pwd
      - echo Source directory
      - echo "${CODEBUILD_SRC_DIR:-$PWD}"
      - echo Files
      - ls -la "${CODEBUILD_SRC_DIR:-$PWD}"
      - echo Directories
      - find "${CODEBUILD_SRC_DIR:-$PWD}" -maxdepth 3 -type d | sort
      - |
        APP_DIR=""
        for candidate in "${CODEBUILD_SRC_DIR:-$PWD}" "${CODEBUILD_SRC_DIR:-$PWD}/application" "${CODEBUILD_SRC_DIR:-$PWD}/src/application" "${CODEBUILD_SRC_DIR:-$PWD}/src"; do
          if [ -f "$candidate/Dockerfile" ]; then APP_DIR="$candidate"; break; fi
        done
        if [ -z "$APP_DIR" ]; then echo "application directory missing"; exit 1; fi
        echo "Using application directory: $APP_DIR"
        docker build -t nginx-app -f "$APP_DIR/Dockerfile" "$APP_DIR"

      - echo Tagging Docker image
      - docker tag nginx-app:latest $ECR_REPOSITORY_URI:latest

      - echo Creating Elastic Beanstalk deployment file
      - |
        cat > Dockerrun.aws.json <<EOF
        {
        "AWSEBDockerrunVersion": "1",
        "Image": {
        "Name": "$ECR_REPOSITORY_URI:latest",
        "Update": "true"
        },
        "Ports": [
        {
          "ContainerPort": "80"
        }
        ]
        }
        EOF

      - zip deploy.zip Dockerrun.aws.json

  post_build:
    commands:
      - echo Pushing Docker image to ECR
      - docker push $ECR_REPOSITORY_URI:latest

artifacts:
  files:
    - application/deploy.zip
